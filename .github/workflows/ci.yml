name: V2 Rewrite CI Pipeline

on:
  push:
    branches: [ "main", "refactor/*" ]
#   pull_request:
#     branches: [ "main" ]

jobs:
  code-quality-and-test:
    name: 程式碼檢查與測試
    runs-on: ubuntu-latest

    steps:
      - name: 0. 準備報告資料夾
        run: mkdir -p ci-reports

      - name: 1. 取得程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝與設定 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 3. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version" # 自動讀取 uv 設定的版本

      - name: 4. 安裝專案套件
        run: uv sync --all-extras --dev

      - name: 5. 執行 Ruff (程式碼風格與語法檢查)
        # 發生錯誤時直接在 GitHub 程式碼行數上標註
        run: uv run ruff check . --output-format=github

      - name: 6. 執行 Bandit (安全性掃描)
        run: |
          echo "### Bandit 資安掃描報告" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY

          uv run bandit -c pyproject.toml -ll | tee -a $GITHUB_STEP_SUMMARY

          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 7. 執行 Mypy (靜態型別安全檢查)
        run: |
          echo "### MyPy 型別檢查報告" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          uv run mypy --html-report ci-reports/mypy | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 8. 執行 Pytest (單元測試)
        run: >
          uv run pytest
          --html=ci-reports/pytest.html --self-contained-html
          --md-report --md-report-output ci-reports/md_report.md

      - name: 9. 將測試報告寫入 GitHub 面板
        if: always()
        # 把 Markdown 檔案的內容，倒進 GitHub 的摘要變數中
        run: cat ci-reports/md_report.md >> $GITHUB_STEP_SUMMARY

      - name: 10. 儲存測試報告附件
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-ci-reports
          path: ci-reports/
          retention-days: 7
