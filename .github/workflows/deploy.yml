name: CI/CD Pipeline to GCP Cloud Run

on:
  push:
    branches:
      - refactor/v2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 取得程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. 下載套件並執行測試
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen --no-cache
          # 使用 uv run 執行 pytest
          uv run pytest src/tests/

      - name: 4. 登入 Cloud Run
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 5. 部署至 Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ai-todo-list-backend
          region: asia-east1 # 台灣彰化機房
          source: .          # 此專案資料夾有 Dockerfile

      - name: 6. 顯示部署結果
        run: echo "部署成功！你的雲端網址是 ${{ steps.deploy.outputs.url }}"
