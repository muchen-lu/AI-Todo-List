name: CD Pipeline to GCP Cloud Run

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: ["refactor/v2"]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: 1. 取得程式碼
        uses: actions/checkout@v4

      - name: 2. 登入 Cloud Run
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 3. 部署至 Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ai-todo-list-backend
          region: asia-east1 # 台灣彰化機房
          source: .          # 此專案資料夾有 Dockerfile

      - name: 4. 顯示部署結果
        run: echo "部署成功！你的雲端網址是 ${{ steps.deploy.outputs.url }}"
