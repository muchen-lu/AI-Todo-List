repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace  # delete remaining whitespace at the end of lines
      - id: end-of-file-fixer    # ensure all files have a trailing newline (Git's preferred format)
      - id: check-yaml           # check your yaml files (like ci.yml) for indentation errors
      - id: check-added-large-files # prevent accidentally committing large files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
