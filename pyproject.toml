[project]
name = "ai-todo-list"
version = "0.1.0"
description = "這是一個用 AI 來協助管理任務的工具，會自動從 ONO 和 Google Classroom 上抓任務，亦支援手動輸入。每天早上 7:00 會準時用 Line 發通知幫你決定今天要做的 5 件事情。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.2",
    "beautifulsoup4>=4.14.3",
    "dotenv>=0.9.9",
    "fastapi>=0.142.2",
    "firebase-admin>=7.3.0",
    "google-api-python-client>=2.193.0",
    "google-auth-oauthlib>=1.3.1",
    "google-cloud-tasks>=2.23.0",
    "google-generativeai>=0.8.6",
    "line-bot-sdk>=3.22.0",
    "pydantic>=2.12.5",
    "pytz>=2026.1.post1",
    "requests>=2.33.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
gui = [
    "keyboard>=0.13.5",
    "playwright>=1.58.0",
    "pyqt6>=6.11.0",
    ]