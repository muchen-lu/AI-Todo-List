[project]
name = "ai-todo-list"
version = "0.2.0"
description = "這是一個用 AI 來協助管理任務的工具，會自動從 ONO 和 Google Classroom 上抓任務，亦支援手動輸入。每天早上 7:00 會準時用 Line 發通知幫你決定今天要做的 5 件事情。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.2",
    "beautifulsoup4>=4.14.3",
    "cryptography>=46.0.6",
    "dotenv>=0.9.9",
    "fastapi>=0.142.2",
    "firebase-admin>=7.3.0",
    "google-api-python-client>=2.193.0",
    "google-auth-oauthlib>=1.3.1",
    "google-cloud-tasks>=2.23.0",
    "google-generativeai>=0.8.6",
    "line-bot-sdk>=3.22.0",
    "pydantic>=2.12.5",
    "pytz>=2026.1.post1",
    "requests>=2.33.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
gui = [
    "keyboard>=0.13.5",
    "playwright>=1.58.0",
    "pyqt6>=6.11.0",
    ]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "lxml>=6.1.3",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "pytest-md-report>=0.8.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.17.0",
]

[tool.mypy]
files = ["src"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
    "linebot.*",
    "firebase_admin.*",
    "google.auth.*",
    "google.oauth2.*",
    "google_auth_oauthlib.*",
    "googleapiclient.*",
    "pytz.*",
    "keyboard.*",
    "apscheduler.*",
    "google.protobuf.*",
    "playwright.*",
    "PyQt6.*"
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["BLE001", "TRY002"]

[tool.pytest.ini_options]
addopts = "-v --cov=src --cov-report=term-missing"
testpaths = ["src/tests"]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".venv"]
